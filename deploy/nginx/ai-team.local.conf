# Alias domain lokal untuk AI Team: http://ai-team.local → 127.0.0.1:4320
# Pasang: lihat README bagian "Alias domain lokal".

# WebSocket (/api/ws) butuh header Upgrade diteruskan. Permintaan biasa mendapat Connection kosong
# seperti sebelumnya, jadi keep-alive ke upstream tetap jalan.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

server {
    listen 80;
    listen [::]:80;
    server_name ai-team.local;

    # Pesan/lampiran panjang mengikuti batas express.json (20mb) di server.
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:4320;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # WebSocket (/api/ws) dan MJPEG (/api/tasks/:id/live): jangan ditahan di buffer,
        # dan jangan diputus saat agen diam lama (server juga mengirim heartbeat tiap 25 detik).
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
